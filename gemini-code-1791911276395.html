<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#52b9ff;
  --ink:#12305e;
  --title-shadow:#1766b5;
  --yellow:#ffd84a;
  --heart:#e8222a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  min-height:100%;
  background:var(--sky);
  color:#fff;
  font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  -webkit-font-smoothing:none;
}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#cats{position:fixed;inset:0;z-index:1;pointer-events:none}
.cat{position:absolute;pointer-events:auto;cursor:pointer;width:calc(var(--s) * 16);height:calc(var(--s) * 16)}
.cat canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.cat.flip canvas{transform:scaleX(-1)}
.hop{animation:hop .45s steps(6)}
@keyframes hop{
  0%,100%{transform:translateY(0)}
  35%,65%{transform:translateY(calc(var(--s) * -6))}
}

main{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:22px;
  min-height:100svh;
  padding:28px 16px 34vh;
}

.hearts{display:flex;gap:10px}
.hearts canvas{width:40px;height:36px;image-rendering:pixelated;display:block}
.hearts canvas.hop{--s:4px}

h1{
  margin:4px 0 0;text-align:center;font-weight:400;
  font-size:clamp(2.2rem,11vw,5.4rem);line-height:1.18;
  text-shadow:4px 4px 0 var(--title-shadow);
}
h1 span{display:block}

.role-badge{
  font-size:.7rem;background:var(--ink);padding:6px 12px;border-radius:4px;
  box-shadow:0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff;
  color:var(--yellow);text-transform:uppercase;margin-top:-10px;
}

.px{
  background:var(--ink);
  margin:4px;
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff;
}

.result{
  width:min(560px,calc(100vw - 48px));
  min-height:132px;
  padding:18px;
  display:flex;align-items:center;justify-content:center;gap:20px;
  text-align:center;
}
.result canvas{width:96px;height:96px;image-rendering:pixelated;flex:none}
.result canvas[hidden]{display:none}
.result-text{
  font-size:clamp(1rem,4.4vw,1.9rem);line-height:1.5;
  overflow-wrap:anywhere;min-width:0;
}
.result-text.idle{font-size:clamp(.7rem,2.6vw,.95rem);line-height:1.9;color:#bcd6ff}
.result-text.spin{color:#fff}
.result-text.win{color:var(--yellow)}
.result-text.long{font-size:clamp(.8rem,3.2vw,1.3rem)}

.start{
  font:inherit;font-size:clamp(.85rem,2.8vw,1.15rem);
  color:#fff;background:var(--heart);
  border:0;margin:4px;padding:18px 26px;cursor:pointer;
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 -6px 0 #a81119;
  text-shadow:3px 3px 0 #7a0d16;
}
.start:hover:not(:disabled){background:#ff3b43}
.start:active:not(:disabled){transform:translateY(4px)}
.start:disabled{background:#7d8aa3;box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 -6px 0 #5b6781;cursor:default;text-shadow:3px 3px 0 #44506a}
:focus-visible{outline:4px dashed var(--yellow);outline-offset:8px}

.panel{
  width:min(560px,calc(100vw - 48px));
  padding:20px;
  display:flex;flex-direction:column;gap:14px;
}
.panel label.title{font-size:.72rem;line-height:1.8}
textarea{
  width:100%;min-height:170px;resize:vertical;
  font:inherit;font-size:.75rem;line-height:2;
  color:#fff;background:#0a1d3b;
  border:0;margin:0;padding:12px;
  box-shadow:inset 0 0 0 4px #3b66a8;
}
textarea::placeholder{color:#7f9bc7}
.meta{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;font-size:.62rem;line-height:1.8}
.opt{display:flex;align-items:center;gap:10px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--heart);margin:0;cursor:pointer}
.link{
  font:inherit;font-size:.62rem;color:#bcd6ff;background:none;border:0;padding:6px 0;cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;
}
.link:hover{color:#fff}
.history{font-size:.62rem;line-height:2;color:#bcd6ff;overflow-wrap:anywhere}
.history b{font-weight:400;color:var(--yellow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

[hidden]{display:none !important}
.qa{
  width:min(560px,calc(100vw - 48px));padding:20px;
  display:flex;flex-direction:column;gap:14px;text-align:center;
}
.qa-who{font-size:.7rem;line-height:1.8;color:var(--yellow)}
.qa-q{font-size:clamp(.85rem,3.4vw,1.2rem);line-height:1.7;overflow-wrap:anywhere}
.qa-a{font-size:clamp(.75rem,3vw,1rem);line-height:1.7;color:#9dffb0;overflow-wrap:anywhere}
.qa-msg{font-size:.75rem;line-height:1.8;color:var(--yellow)}
.qa-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sm{
  font:inherit;font-size:.72rem;color:#fff;background:#2f6fd0;
  border:0;margin:4px;padding:12px 16px;cursor:pointer;
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 -4px 0 #1b4a96;
}
.sm.ok{background:#2fa84f;box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 -4px 0 #1d7a37}
.sm.no{background:#d9822b;box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 -4px 0 #a45d14}
.sm:hover{filter:brightness(1.12)}
.sm:active{transform:translateY(4px)}

body.player-mode .host-only { display: none !important; }

@media (max-width:480px){
  .result{flex-direction:column;gap:12px;padding:16px 12px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  .hop{animation:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="cats" aria-hidden="true"></div>

<main>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <h1><span>NAME</span><span>PICKER</span></h1>
  <div class="role-badge" id="roleBadge">Host Mode</div>

  <div class="result px" id="resultBox">
    <canvas id="winCat" width="16" height="16" hidden aria-hidden="true"></canvas>
    <div class="result-text idle" id="resultText">Add names below, then press start</div>
  </div>

  <button class="start host-only" id="startBtn" type="button">PRESS TO START</button>

  <section class="qa px" id="qa" aria-label="Question" hidden>
    <div class="qa-who" id="qaWho"></div>
    <div class="qa-q" id="qaQ"></div>
    <div class="qa-a" id="qaA" hidden></div>
    <div class="qa-msg" id="qaMsg" hidden></div>
    <div class="qa-btns host-only" id="qaBtns">
      <button class="sm" id="showAns" type="button">SHOW ANSWER</button>
      <button class="sm ok" id="markRight" type="button" hidden>CORRECT</button>
      <button class="sm no" id="markWrong" type="button" hidden>NOT YET</button>
    </div>
  </section>

  <section class="panel px host-only" aria-label="Names">
    <label class="title" for="names">Names (one per line)</label>
    <textarea id="names" spellcheck="false" autocomplete="off" placeholder="Type or paste names here"></textarea>
    <div class="meta">
      <span id="count">0 names</span>
      <label class="opt"><input type="checkbox" id="removeOpt"> Remove picked names</label>
      <label class="opt"><input type="checkbox" id="soundOpt" checked> Sound</label>
    </div>
    <div class="history" id="history" hidden></div>
    <div><button class="link" id="clearHistory" type="button" hidden>Clear picked list</button></div>
  </section>

  <section class="panel px host-only" aria-label="Questions">
    <label class="title" for="questions">Questions (question | answer)</label>
    <textarea id="questions" spellcheck="false" autocomplete="off" placeholder="One per line. Add | then the answer, or leave the answer out."></textarea>
    <div class="meta">
      <span id="qCount">0 questions</span>
      <label class="opt"><input type="checkbox" id="askOpt" checked> Ask after each pick</label>
    </div>
    <div class="history" id="scores" hidden></div>
    <div><button class="link" id="clearScores" type="button" hidden>Clear scores</button></div>
  </section>
</main>

<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Role & BroadcastChannel Setup ---------- */
  var urlParams = new URLSearchParams(window.location.search);
  var isPlayer = urlParams.get('role') === 'player';
  var channel = new BroadcastChannel('cat_name_picker_sync');

  if (isPlayer) {
    document.body.classList.add('player-mode');
    $('roleBadge').textContent = 'Player View';
  }

  function broadcast(type, payload) {
    if (!isPlayer) {
      channel.postMessage({ type: type, payload: payload });
    }
  }

  /* ---------- random ---------- */
  function randInt(n){
    var a = new Uint32Array(1);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return a[0] % n;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = randInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- cat sprites ---------- */
  var BASE = [
    "..OO........OO..",
    ".OBPO......OPBO.",
    ".OBPBOOOOOOBPBO.",
    ".OBBBBBBBBBBBBO.",
    "OBBBBBBBBBBBBBBO",
    "OBBEKBBBBBBKEBBO",
    "OBBEEBBBBBBEEBBO",
    ".OBBBBBNNBBBBBO.",
    ".OBBBBLLLLBBBBO.",
    "..OOBBBBBBBBOO..",
    ".OBBBLLLLLLBBBO.",
    "OBBBLLLLLLLLBBBO",
    "OBBBLLLLLLLLBBBO",
    "OBBBLLLLLLLLBBBO",
    "OBBBBLLLLLLBBBBO",
    ".OOOOOOOOOOOOOO."
  ];
  var DEF = {K:'#1b1b22', N:'#f08a9b', P:'#f4a6b6', D:'#3b3b44', W:'#ffffff'};
  var TABBY = [[4,3],[7,3],[8,3],[11,3],[1,5],[14,5],[2,11],[13,11],[1,12],[14,12],[2,13],[13,13]];

  var CATS = [
    {name:'Pebble',  c:{O:'#3b3f4e',B:'#b9bcc4',L:'#eceef2',S:'#7d8190',E:'#7ed957'}, marks:TABBY},
    {name:'Marmalade',c:{O:'#6a3410',B:'#f0923a',L:'#fff1dc',S:'#cf6a1c',E:'#7ed957'}, marks:TABBY},
    {name:'Shadow',  c:{O:'#0e0e14',B:'#35353f',L:'#4c4c58',E:'#f5c542',N:'#c06c84',P:'#6b4a5a'}, marks:[]},
    {name:'Snowball',c:{O:'#8a8fb0',B:'#fbfbff',L:'#e9edf7',E:'#4aa3ff'}, marks:[]},
    {name:'Patches', c:{O:'#4a3a33',B:'#fffaf0',L:'#ffffff',S:'#f0923a',D:'#3b3b44',E:'#f5c542'},
      marks:[[2,3,'S'],[3,3,'S'],[2,4,'S'],[3,4,'S'],[1,5,'S'],[11,3,'D'],[12,4,'D'],[13,4,'D'],[13,5,'D'],
             [1,11,'S'],[2,11,'S'],[1,12,'S'],[2,12,'S'],[3,12,'S'],[13,12,'D'],[14,12,'D'],[13,13,'D'],[14,13,'D'],[12,13,'D']]},
    {name:'Mochi',   c:{O:'#5a3f33',B:'#f3e3c8',L:'#fff6e6',S:'#6b4a3a',E:'#4aa3ff'},
      marks:[[2,1],[13,1],[2,2],[4,2],[11,2],[13,2],[5,7],[6,7],[9,7],[10,7],[6,8],[7,8],[8,8],[9,8]]},
    {name:'Tux',     c:{O:'#14141a',B:'#2e2e3a',L:'#ffffff',E:'#7ed957'},
      marks:[[7,3,'W'],[8,3,'W'],[7,4,'W'],[8,4,'W'],[7,5,'W'],[8,5,'W'],[7,6,'W'],[8,6,'W']]},
    {name:'Misty',   c:{O:'#3a4a5c',B:'#8fa3b8',L:'#dde7f0',S:'#5f7389',E:'#f2c94c'}, marks:TABBY},
    {name:'Biscuit', c:{O:'#4a2e18',B:'#c4905a',L:'#f1dcc0',S:'#8a5a32',E:'#7ed957'}, marks:TABBY},
    {name:'Peaches', c:{O:'#8a5a3a',B:'#f6d9b0',L:'#fff3e0',S:'#e8b27a',E:'#3fc1b0'}, marks:TABBY}
  ];

  function sprite(cat, target){
    var c = target || document.createElement('canvas');
    c.width = 16; c.height = 16;
    var x = c.getContext('2d');
    x.clearRect(0,0,16,16);
    var g = BASE.map(function(r){ return r.split(''); });
    (cat.marks || []).forEach(function(m){ g[m[1]][m[0]] = m[2] || 'S'; });
    var pal = {};
    Object.keys(DEF).forEach(function(k){ pal[k] = DEF[k]; });
    Object.keys(cat.c).forEach(function(k){ pal[k] = cat.c[k]; });
    g.forEach(function(row, y){
      row.forEach(function(k, xx){
        if (k !== '.'){ x.fillStyle = pal[k]; x.fillRect(xx, y, 1, 1); }
      });
    });
    return c;
  }

  /* ---------- hearts ---------- */
  var HEART = [" .XX.XX. ","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
  function heartCanvas(){
    var c = document.createElement('canvas');
    c.width = 9; c.height = 8;
    var x = c.getContext('2d');
    var cells = [];
    HEART.forEach(function(row, y){ row.split('').forEach(function(k, xx){ if (k === 'X') cells.push([xx+1, y+1]); }); });
    x.fillStyle = '#7a0d16';
    cells.forEach(function(p){
      for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) x.fillRect(p[0]+dx, p[1]+dy, 1, 1);
    });
    x.fillStyle = '#e8222a';
    cells.forEach(function(p){ x.fillRect(p[0], p[1], 1, 1); });
    x.fillStyle = '#ff8a8a';
    x.fillRect(2, 2, 1, 1); x.fillRect(2, 3, 1, 1);
    return c;
  }
  var heartsEl = $('hearts');
  for (var h = 0; h < 3; h++) heartsEl.appendChild(heartCanvas());

  /* ---------- background ---------- */
  var bg = $('bg'), H = 108, W = 192;
  function front(u){ return H * (0.20 + 0.05 * Math.sin(u * 6.0 + 1.2) + 0.025 * Math.sin(u * 13 + 0.5)); }
  function back(u){ return H * (0.31 + 0.05 * Math.sin(u * 4.0 + 3) + 0.02 * Math.sin(u * 9)); }

  var CLOUDS = [
    {u:.12, v:.20, k:1.0, c:[[-14,2,7],[-6,-3,10],[6,-1,9],[15,3,7],[0,4,8]]},
    {u:.84, v:.30, k:1.2, c:[[-15,3,7],[-5,-2,10],[7,-4,11],[17,2,8],[2,5,9]]},
    {u:.52, v:.08, k:.7,  c:[[-12,2,6],[-3,-2,8],[8,0,8],[14,3,5]]},
    {u:.06, v:.62, k:.8,  c:[[-12,2,6],[-3,-3,9],[8,-1,8],[15,3,6]]}
  ];

  function drawBg(){
    H = 108;
    W = Math.max(60, Math.round(H * window.innerWidth / window.innerHeight));
    bg.width = W; bg.height = H;
    var x = bg.getContext('2d');
    x.fillStyle = '#52b9ff'; x.fillRect(0, 0, W, H);

    var mask = new Uint8Array(W * H);
    CLOUDS.forEach(function(cl){
      var cx = cl.u * W, cy = cl.v * H;
      cl.c.forEach(function(ci){
        var px = cx + ci[0] * cl.k, py = cy + ci[1] * cl.k, r = ci[2] * cl.k;
        for (var yy = Math.floor(py - r); yy <= Math.ceil(py + r); yy++){
          for (var xx = Math.floor(px - r); xx <= Math.ceil(px + r); xx++){
            if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
            var dx = xx - px, dy = yy - py;
            if (dx * dx + dy * dy <= r * r) mask[yy * W + xx] = 1;
          }
        }
      });
    });
    for (var yy = 0; yy < H; yy++){
      for (var xx = 0; xx < W; xx++){
        if (!mask[yy * W + xx]) continue;
        var below = (yy + 2 < H) ? mask[(yy + 2) * W + xx] : 1;
        x.fillStyle = below ? '#ffffff' : '#cfe3f8';
        x.fillRect(xx, yy, 1, 1);
      }
    }

    for (var xi = 0; xi < W; xi++){
      var u = xi / W;
      var bt = H - Math.round(back(u));
      x.fillStyle = '#98d14e';
      x.fillRect(xi, bt, 1, H - bt);
      var ft = H - Math.round(front(u));
      for (var y = ft; y < H; y++){
        var d = y - ft, col;
        if (d < 2) col = '#a8dc4c';
        else if (d < 9) col = '#7bc23a';
        else if (d < 12) col = ((xi + y) & 1) ? '#7bc23a' : '#62a82c';
        else col = '#62a82c';
        x.fillStyle = col;
        x.fillRect(xi, y, 1, 1);
      }
    }
  }

  /* ---------- cats on the hills ---------- */
  var layer = $('cats');
  var order = shuffle(CATS.map(function(_, i){ return i; }));
  var catEls = [];

  function layoutCats(){
    layer.innerHTML = '';
    catEls = [];
    var s = Math.max(3, Math.round(window.innerHeight / 170));
    var n = Math.max(3, Math.min(CATS.length, Math.floor(window.innerWidth / (16 * s * 1.25))));
    for (var i = 0; i < n; i++){
      var u = (i + 0.5) / n + (((i * 7919) % 13) - 6) / 13 * 0.15 / n;
      var el = document.createElement('div');
      el.className = 'cat' + (i % 2 ? ' flip' : '');
      el.style.setProperty('--s', s + 'px');
      el.style.left = 'calc(' + (u * 100).toFixed(2) + '% - ' + (8 * s) + 'px)';
      el.style.bottom = Math.round(front(u) / H * window.innerHeight - s * 3) + 'px';
      el.appendChild(sprite(CATS[order[i]]));
      el.addEventListener('click', function(e){ hop(e.currentTarget); blip(520, .05); });
      el.addEventListener('animationend', function(e){ e.currentTarget.classList.remove('hop'); });
      layer.appendChild(el);
      catEls.push(el);
    }
  }
  function hop(el){
    if (!el || reduce) return;
    el.classList.remove('hop');
    void el.offsetWidth;
    el.classList.add('hop');
  }
  function randomCat(){ return catEls.length ? catEls[randInt(catEls.length)] : null; }
  function wave(){
    catEls.forEach(function(el, i){ setTimeout(function(){ hop(el); }, i * 90); });
  }

  var resizeTimer;
  function relayout(){ drawBg(); layoutCats(); }
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 150);
  });

  /* ---------- sound ---------- */
  var ac;
  var soundOpt = $('soundOpt');
  function blip(freq, dur){
    if (!soundOpt.checked) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.value = 0.035;
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + (dur || 0.06));
    } catch (e) {}
  }
  function jingle(){
    [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ blip(f, .12); }, i * 110); });
  }

  /* ---------- state ---------- */
  var ta = $('names'), countEl = $('count'), startBtn = $('startBtn');
  var resultText = $('resultText'), winCat = $('winCat'), live = $('live');
  var removeOpt = $('removeOpt'), historyEl = $('history'), clearBtn = $('clearHistory');
  var history = [], running = false;
  var qs = $('questions'), qCount = $('qCount'), askOpt = $('askOpt');
  var scoresEl = $('scores'), clearScoresBtn = $('clearScores'), scores = {};
  var qa = $('qa'), qaWho = $('qaWho'), qaQ = $('qaQ'), qaA = $('qaA'), qaMsg = $('qaMsg'), qaBtns = $('qaBtns');
  var showAns = $('showAns'), markRight = $('markRight'), markWrong = $('markWrong');

  var SAMPLE = 'Xavier\nMia\nLeo\nNora\nSam';
  var SAMPLEQ = 'What sound does a cat make? | Meow\nWhat do cats love to chase? | Mice, or a laser dot\nWhat is a group of kittens called? | A litter\nWhat planet do we live on? | Earth\nName a food cats love. | Fish\nTell us your favorite animal and why.';

  function load(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('catNamePicker') || 'null'); } catch (e) {}
    if (saved && typeof saved.names === 'string'){
      ta.value = saved.names;
      removeOpt.checked = !!saved.remove;
      soundOpt.checked = saved.sound !== false;
      history = Array.isArray(saved.history) ? saved.history.slice(-12) : [];
      qs.value = typeof saved.questions === 'string' ? saved.questions : SAMPLEQ;
      askOpt.checked = saved.ask !== false;
      scores = (saved.scores && typeof saved.scores === 'object') ? saved.scores : {};
    } else {
      ta.value = SAMPLE;
      qs.value = SAMPLEQ;
    }
  }
  function save(){
    try {
      localStorage.setItem('catNamePicker', JSON.stringify({
        names: ta.value, remove: removeOpt.checked, sound: soundOpt.checked, history: history,
        questions: qs.value, ask: askOpt.checked, scores: scores
      }));
    } catch (e) {}
  }
  function getNames(){
    return ta.value.split(/[\n,]/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function updateCount(){
    var n = getNames().length;
    countEl.textContent = n + (n === 1 ? ' name' : ' names');
  }
  function renderHistory(){
    if (!history.length){ historyEl.hidden = true; clearBtn.hidden = true; return; }
    historyEl.hidden = false; clearBtn.hidden = false;
    historyEl.innerHTML = '';
    historyEl.appendChild(document.createTextNode('Picked so far: '));
    history.forEach(function(nm, i){
      var b = document.createElement('b');
      b.textContent = nm;
      historyEl.appendChild(b);
      if (i < history.length - 1) historyEl.appendChild(document.createTextNode(', '));
    });
  }
  function setResult(text, cls){
    resultText.textContent = text;
    resultText.className = 'result-text ' + (cls || '') + (text.length > 14 && cls !== 'idle' ? ' long' : '');
  }

  ta.addEventListener('input', function(){ updateCount(); save(); });
  removeOpt.addEventListener('change', save);
  soundOpt.addEventListener('change', save);
  clearBtn.addEventListener('click', function(){ history = []; renderHistory(); save(); });

  /* ---------- picking ---------- */
  function start(){
    if (running || isPlayer) return;
    var names = getNames();
    if (!names.length){
      winCat.hidden = true;
      setResult('No names yet. Add some below.', 'idle');
      ta.focus();
      return;
    }
    running = true;
    startBtn.disabled = true;
    startBtn.textContent = 'PICKING...';
    winCat.hidden = true;
    closeQA();

    broadcast('START_SPIN', {});

    var winIdx = randInt(names.length);
    var winner = names[winIdx];
    var catIdx = randInt(CATS.length);

    function finish(){
      setResult(winner, 'win');
      var cat = CATS[catIdx];
      sprite(cat, winCat);
      winCat.hidden = false;
      jingle();
      wave();
      Array.prototype.forEach.call(heartsEl.children, function(hc, i){
        setTimeout(function(){ hop(hc); }, i * 120);
      });
      history.push(winner);
      history = history.slice(-12);
      if (removeOpt.checked){
        names.splice(winIdx, 1);
        ta.value = names.join('\n');
        updateCount();
      }
      renderHistory();
      save();
      live.textContent = 'Picked: ' + winner;
      running = false;
      startBtn.disabled = false;
      startBtn.textContent = 'PICK AGAIN';

      broadcast('WINNER', { winner: winner, catIdx: catIdx });

      if (!askQuestion(winner)) startBtn.focus({preventScroll:true});
    }

    if (reduce){ finish(); return; }

    var i = 0, total = 22, last = '';
    function tick(){
      if (i >= total){ finish(); return; }
      var nm;
      if (i === total - 1){ nm = winner; }
      else if (names.length > 1){
        do { nm = names[randInt(names.length)]; } while (nm === last);
      } else { nm = names[0]; }
      last = nm;
      setResult(nm, 'spin');
      blip(300 + (i % 6) * 60, .05);
      hop(randomCat());
      broadcast('TICK', { name: nm, freq: 300 + (i % 6) * 60 });
      i++;
      setTimeout(tick, 55 + i * i * 0.4);
    }
    tick();
  }
  startBtn.addEventListener('click', start);

  /* ---------- questions and answers ---------- */
  var qBag = [], cur = null;

  function getQuestions(){
    return ta.value === undefined ? [] : qs.value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
      var i = l.indexOf('|');
      return i < 0 ? {q:l, a:''} : {q:l.slice(0, i).trim(), a:l.slice(i + 1).trim()};
    }).filter(function(x){ return x.q; });
  }
  function updateQCount(){
    var n = getQuestions().length;
    qCount.textContent = n + (n === 1 ? ' question' : ' questions');
  }
  function nextQuestion(){
    var all = getQuestions();
    if (!all.length) return null;
    qBag = qBag.filter(function(x){ return all.some(function(y){ return y.q === x.q; }); });
    if (!qBag.length) qBag = shuffle(all);
    return qBag.pop();
  }
  function renderScores(){
    var keys = Object.keys(scores).filter(function(k){ return scores[k] > 0; })
      .sort(function(a, b){ return scores[b] - scores[a]; });
    if (!keys.length){ scoresEl.hidden = true; clearScoresBtn.hidden = true; return; }
    scoresEl.hidden = false; clearScoresBtn.hidden = false;
    scoresEl.innerHTML = '';
    scoresEl.appendChild(document.createTextNode('Scores: '));
    keys.forEach(function(k, i){
      var b = document.createElement('b');
      b.textContent = k + ' ' + scores[k];
      scoresEl.appendChild(b);
      if (i < keys.length - 1) scoresEl.appendChild(document.createTextNode(', '));
    });
  }
  function closeQA(){ 
    qa.hidden = true; 
    cur = null; 
    broadcast('CLOSE_QA', {});
  }
  function askQuestion(name){
    if (!askOpt.checked) return false;
    var q = nextQuestion();
    if (!q) return false;
    cur = {name:name, q:q};
    qaWho.textContent = name + ', your question:';
    qaQ.textContent = q.q;
    qaA.hidden = true; qaMsg.hidden = true; qaBtns.hidden = false;
    var hasA = !!q.a;
    showAns.hidden = !hasA; markRight.hidden = hasA; markWrong.hidden = hasA;
    qa.hidden = false;

    broadcast('ASK_QUESTION', { name: name, q: q.q });

    try { qa.scrollIntoView({block:'nearest', behavior: reduce ? 'auto' : 'smooth'}); } catch (e) {}
    (hasA ? showAns : markRight).focus({preventScroll:true});
    return true;
  }
  function endQA(msg){
    qaBtns.hidden = true;
    qaMsg.textContent = msg; qaMsg.hidden = false;
    renderScores(); save();
    live.textContent = msg;
    
    broadcast('END_QA', { msg: msg });

    cur = null;
    startBtn.focus({preventScroll:true});
  }

  showAns.addEventListener('click', function(){
    if (!cur) return;
    qaA.textContent = 'Answer: ' + cur.q.a;
    qaA.hidden = false;
    showAns.hidden = true; markRight.hidden = false; markWrong.hidden = false;
    blip(660, .08);
    markRight.focus({preventScroll:true});

    broadcast('SHOW_ANSWER', { answer: cur.q.a });
  });

  markRight.addEventListener('click', function(){
    if (!cur) return;
    var nm = cur.name;
    scores[nm] = (scores[nm] || 0) + 1;
    jingle(); wave();
    Array.prototype.forEach.call(heartsEl.children, function(hc, i){
      setTimeout(function(){ hop(hc); }, i * 120);
    });
    endQA('Correct! +1 for ' + nm);
  });

  markWrong.addEventListener('click', function(){
    if (!cur) return;
    blip(200, .25);
    endQA('Good try, ' + cur.name + '!');
  });

  qs.addEventListener('input', function(){ updateQCount(); save(); });
  askOpt.addEventListener('change', function(){ if (!askOpt.checked) closeQA(); save(); });
  clearScoresBtn.addEventListener('click', function(){ scores = {}; renderScores(); save(); });

  /* ---------- Player View Sync Handler ---------- */
  channel.onmessage = function(e) {
    if (!isPlayer) return;
    var data = e.data;
    var type = data.type;
    var payload = data.payload;

    if (type === 'START_SPIN') {
      winCat.hidden = true;
      qa.hidden = true;
    } else if (type === 'TICK') {
      setResult(payload.name, 'spin');
      blip(payload.freq, .05);
      hop(randomCat());
    } else if (type === 'WINNER') {
      setResult(payload.winner, 'win');
      sprite(CATS[payload.catIdx], winCat);
      winCat.hidden = false;
      jingle(); wave();
      Array.prototype.forEach.call(heartsEl.children, function(hc, i){
        setTimeout(function(){ hop(hc); }, i * 120);
      });
    } else if (type === 'ASK_QUESTION') {
      qaWho.textContent = payload.name + ', your question:';
      qaQ.textContent = payload.q;
      qaA.hidden = true; qaMsg.hidden = true;
      qa.hidden = false;
    } else if (type === 'SHOW_ANSWER') {
      qaA.textContent = 'Answer: ' + payload.answer;
      qaA.hidden = false;
      blip(660, .08);
    } else if (type === 'END_QA') {
      qaMsg.textContent = payload.msg; 
      qaMsg.hidden = false;
    } else if (type === 'CLOSE_QA') {
      qa.hidden = true;
    }
  };

  /* ---------- init ---------- */
  load();
  updateCount();
  updateQCount();
  renderScores();
  renderHistory();
  relayout();
})();
</script>
</body>
</html>
